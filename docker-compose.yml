name: lead-intake

services:
  db:
    image: postgres:16
    container_name: lead-intake-db
    restart: unless-stopped
    environment:
      # Local development credentials only. Deployment overrides these from the
      # environment (see docker-compose.prod.yml).
      POSTGRES_USER: ${POSTGRES_USER:-lead_intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lead_intake}
      POSTGRES_DB: ${POSTGRES_DB:-lead_intake}
      # Second database on the same server, used by `npm test` so tests never
      # touch development data. Created by the init script below.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-lead_intake_test}
    ports:
      # 5435 on the host to avoid colliding with a local Postgres on 5432.
      - '${DB_PORT:-5435}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-lead_intake}" -d "${POSTGRES_DB:-lead_intake}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  db-data:
