# Host nginx terminates TLS, so the scheme the browser used only survives in the header.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker gives the api container a new address every time it is recreated, so the upstream
  # is resolved per request instead of once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream api:4000;

    # The API serves the brief's paths at the root, so the /api prefix is stripped here.
    rewrite ^/api/(.*)$ /$1 break;

    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;
  }

  # Vite fingerprints everything in here, so a changed file always has a changed URL.
  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  location / {
    try_files $uri /index.html;
  }
}
