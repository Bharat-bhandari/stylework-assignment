# Host nginx site for the deployed stack. Copy to /etc/nginx/sites-available/, symlink into
# sites-enabled/, then let `certbot --nginx` add the TLS server block and the redirect.
server {
  listen 80;
  listen [::]:80;

  server_name leads.himalayandev.tech;

  access_log /var/log/nginx/leads.himalayandev.tech.access.log;
  error_log /var/log/nginx/leads.himalayandev.tech.error.log;

  # Webhook deliveries are a few kB; the API itself rejects bodies over 1 MB.
  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
